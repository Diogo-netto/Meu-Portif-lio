<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview - Pet Agenda Pro | Diogo Netto</title>
    <link rel="icon" href="img/favicon-16x16.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- CSS Adicional específico para a tela de preview -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-main);
            padding-top: 80px; /* Espaço do header */
        }
        .back-header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 20px 24px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            display: flex;
            justify-content: flex-start;
        }
        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        .preview-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    
    <!-- Cabeçalho com botão voltar -->
    <div class="back-header">
        <a href="index.html#projetos" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Voltar ao Portfólio</a>
    </div>

    <!-- Container da Imagem -->
    <div class="preview-container">
        <!-- Coloque o nome correto da foto da sua agenda aqui embaixo -->
        <img src="img/Captura de tela 2026-08-15 151705.png" alt="Interface do Sistema Pet Agenda Pro" class="preview-image">
    </div>

</body>
</html>
